<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Set 1 - Made by Sharbik Ahamed</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --option-bg: #fafafa;
            --option-border: #ddd;
            --header-color: #1a365d;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --option-bg: #2d2d2d;
            --option-border: #404040;
            --header-color: #64b5f6;
        }

        body.daylight-mode {
            --bg-color: #fefae0;
            --card-bg: #faedcd;
            --text-color: #283618;
            --option-bg: #f4a26122;
            --option-border: #dda15e;
            --header-color: #bc6c25;
        }

        body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; transition: 0.3s; }
        .exam-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--header-color); margin-bottom: 5px; }
        .made-by { text-align: center; font-weight: bold; color: #2563eb; margin-bottom: 15px; font-size: 1.1em; }
        
        .theme-switcher { text-align: center; margin-bottom: 20px; }
        .theme-btn { padding: 8px 14px; margin: 0 4px; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .user-info { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .user-info input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid var(--option-border); border-radius: 4px; box-sizing: border-box; background: var(--card-bg); color: var(--text-color); }

        .question { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--option-border); }
        .question p { font-weight: bold; font-size: 1.05em; }
        .options label { display: block; margin-bottom: 6px; cursor: pointer; padding: 10px; border-radius: 4px; background: var(--option-bg); border: 1px solid var(--option-border); }
        .options input { margin-right: 8px; }

        button.submit-btn { display: block; width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button.submit-btn:hover { background: #218838; }

        #result { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; background: rgba(0,0,0,0.04); border: 1px solid var(--option-border); }
        .score-box { font-size: 1.6em; font-weight: bold; text-align: center; color: var(--header-color); }
        .summary-stats { text-align: center; font-size: 1.1em; margin-bottom: 20px; }
        
        /* Answer Review Styling */
        .review-card { padding: 12px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid; }
        .review-card.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .review-card.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .review-card.unattempted { background: #fff3cd; border-color: #ffc107; color: #856404; }
        .review-card p { margin: 4px 0; }
        
        #status-msg { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="exam-container">
    <h1>General Knowledge Exam - Set 1</h1>
    <div class="made-by">Made by Sharbik Ahamed</div>

    <div class="theme-switcher">
        <button class="theme-btn" onclick="setTheme('light')">☀️ Light</button>
        <button class="theme-btn" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="theme-btn" onclick="setTheme('daylight')">🌾 Daylight</button>
    </div>

    <form id="examForm">
        <div class="user-info">
            <label><b>Candidate Name:</b></label>
            <input type="text" id="userName" placeholder="Enter Full Name">
            <label><b>Candidate Roll:</b></label>
            <input type="text" id="userRoll" placeholder="Enter Roll Number">
        </div>

        <div id="questionsList"></div>

        <button type="button" class="submit-btn" onclick="submitExam()">Submit Exam</button>
    </form>

    <div id="result">
        <h2>Exam Result & Solutions</h2>
        <div class="score-box">Final Score: <span id="out-score">0</span></div>
        <div class="summary-stats">
            Correct: <strong id="out-correct" style="color:green;">0</strong> | 
            Wrong: <strong id="out-wrong" style="color:red;">0</strong> | 
            Unattempted: <strong id="out-unattempted" style="color:orange;">0</strong>
        </div>

        <div id="status-msg"></div>

        <h3>Answer Breakdown</h3>
        <div id="answerReview"></div>
    </div>
</div>

<script>
    function setTheme(mode) {
        document.body.className = mode + '-mode';
    }

    const quizData = [
        { id: 1, q: "১. \"নোট অব ডিসেন্ট” কী?", opts: ["ভিন্নমত", "আনুষ্ঠানিক ঐক্যমত্য", "সভার কার্য", "চুড়ান্ত সিদ্ধান্ত"], ans: "সভার কার্য" },
        { id: 2, q: "২. লোকশিল্প যাদুঘর কোথায় অবস্থিত?", opts: ["ময়নামতি", "সোনারগাঁও", "ঢাকা", "পাহাড়পুর"], ans: "সোনারগাঁও" },
        { id: 3, q: "৩. শহিদ চান্দু স্টেডিয়াম কোন শহরে অবস্থিত?", opts: ["রাজশাহী", "বগুড়া", "কুমিল্লা", "চট্টগ্রাম"], ans: "বগুড়া" },
        { id: 4, q: "৪. \"দ্য লুপ” কি?", opts: ["জাহাজ", "বৃহত্তম মহাসড়ক", "বোমারু বিমান", "করিডোর"], ans: "বৃহত্তম মহাসড়ক" },
        { id: 5, q: "৫. ভেনেজুয়েলার রাজধানীর নাম কী?", opts: ["কারাকাস", "প্যারিস", "মেক্সিকো সিটি", "ভিয়েনা"], ans: "কারাকাস" },
        { id: 6, q: "৬. চীনের সর্বাধুনিক বিমানবাহী রণতরীর নাম কী?", opts: ["লিয়াওনিং", "সাংহাই", "শানডং", "ফুজিয়ান"], ans: "ফুজিয়ান" },
        { id: 7, q: "৭. চিড়িয়াখানা প্রধানের পদবি কী?", opts: ["রেকটর", "কিউরেটর", "একটর", "মহাপরিচালক"], ans: "কিউরেটর" },
        { id: 8, q: "৮. বাংলাদেশে কৃষি কার্ড এর মাধ্যমে কত কৃষক পরিবারকে সরকারি সুবিধার আওতায় আনা হচ্ছে?", opts: ["১কোটি ৬৫ লাখ", "১কোটি ৮০ লাখ", "৫০লাখ", "২কোটি"], ans: "১কোটি ৬৫ লাখ" },
        { id: 9, q: "৯. 'আইএসবিএন' কোন বিষয়ের সাথে জড়িত?", opts: ["জীববিজ্ঞান", "বই ও প্রকাশনা", "চিত্র শিল্প", "জীনম কোড"], ans: "বই ও প্রকাশনা" },
        { id: 10, q: "১০. জাতিসংঘের মূল অঙ্গসংস্থা কয়টি?", opts: ["৫টি", "৮টি", "৭টি", "৬টি"], ans: "৬টি" },
        { id: 11, q: "১১. কোন দেশ পূর্বে জাতিসংঘের সদস্য ছিল, বর্তমানে নেই?", opts: ["থাইল্যান্ড", "তাইওয়ান", "ইসরায়েল", "দক্ষিণ আফ্রিকা"], ans: "তাইওয়ান" },
        { id: 12, q: "১২. কোন দেশে সমুদ্র বন্দর নেই?", opts: ["লেবানন", "আফগানিস্তান", "মিশর", "আলজেরিয়া"], ans: "আফগানিস্তান" },
        { id: 13, q: "১৩. সংবিধানের কততম সংশোধনীর মাধ্যমে নির্দলীয় তত্ত্বাবধায়ক সরকার গঠিত হয়েছিল?", opts: ["ত্রয়োদশ", "চতুর্দশ", "দ্বাদশ", "পঞ্চদশ"], ans: "ত্রয়োদশ" },
        { id: 14, q: "১৪. ফোর্ট উইলিয়াম কলেজে বাংলা বিভাগ খোলা হয়-", opts: ["১৮০০ সালে", "১৮০১ সালে", "১৮০২ সালে", "১৮০৪ সালে"], ans: "১৮০১ সালে" },
        { id: 15, q: "১৫. অর্থনৈতিক সমীক্ষা-২০২৫ অনুযায়ী বাংলাদেশের জনসংখ্যার ঘনত্ব/প্রতি বর্গ কি.মি কত?", opts: ["১১৭১ জন", "১১৫৬ জন", "১১৮৫ জন", "১১১৫ জন"], ans: "১১৭১ জন" },
        { id: 16, q: "১৬. 'স্বাধীনতা পদক' প্রবর্তন করা হয় কত সালে?", opts: ["১৯৭৬ সাল", "১৯৭৭ সাল", "১৯৬০ সাল", "১৯৫৫ সাল"], ans: "১৯৭৭ সাল" },
        { id: 17, q: "১৭. কাওসার-১ স্যাটেলাইট কোন দেশের?", opts: ["ইরান", "ইরাক", "মিশর", "তুরস্ক"], ans: "ইরান" },
        { id: 18, q: "১৮. আন্তর্জাতিক বিচার আদালতের সদর দপ্তর কোথায় অবস্থিত?", opts: ["নিউইয়র্ক", "হেগ", "জেনেভা", "প্যারিস"], ans: "হেগ" },
        { id: 19, q: "১৯. অর্থসচিব কর্তৃক স্বাক্ষরিত নোট কোনটি?", opts: ["২টাকা", "১০টাকা", "৫০টাকা", "১০০টাকা"], ans: "২টাকা" },
        { id: 20, q: "২০. 'দৈনিক নবযুগ' পত্রিকার সম্পাদক—", opts: ["মোতাহের হোসেন চৌধুরী", "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", "কাজী নজরুল ইসলাম", "গোলাম মোস্তফা"], ans: "কাজী নজরুল ইসলাম" },
        { id: 21, q: "২১. জুলাই সনদ স্বাক্ষরিত হয় কত তারিখে?", opts: ["১৬অক্টোবর", "১৭অক্টোবর", "১৮অক্টোবর", "১৯অক্টোবর"], ans: "১৭অক্টোবর" },
        { id: 22, q: "২২. কিশোর আদালত কোথায় অবস্থিত?", opts: ["পিরোজপুর", "লক্ষ্মীপুর", "গাজীপুর", "নোয়াখালী"], ans: "গাজীপুর" },
        { id: 23, q: "২৩. বাংলাদেশে প্রথম প্রাথমিক শিক্ষা চালু হয় কবে?", opts: ["১৯৯১", "১৯৯২", "১৯৯৩", "১৯০৫"], ans: "১৯৯২" },
        { id: 24, q: "২৪. জাতিসংঘের সদর দপ্তর কোথায়?", opts: ["নিউইয়র্ক", "লন্ডন", "জেনেভা", "প্যারিস"], ans: "নিউইয়র্ক" },
        { id: 25, q: "২৫. নোবেল পুরস্কার প্রবর্তন করা হয় কত সালে?", opts: ["১৯০১", "১৯০৫", "১৯০৫", "১৮৯৬"], ans: "১৯০১" },
        { id: 26, q: "২৬. মোংলা একটি—", opts: ["সমুদ্রবন্দর", "নদী", "নদীবন্দর", "স্থলবন্দর"], ans: "সমুদ্রবন্দর" },
        { id: 27, q: "২৭. বাংলাদেশের প্রাচীনতম নগরী কোনটি?", opts: ["সোনারগাঁও", "দিনাজপুর", "মহাস্থানগড়", "বগুড়া"], ans: "মহাস্থানগড়" },
        { id: 28, q: "২৮. বরেন্দ্র জাদুঘর কোথায় অবস্থিত?", opts: ["পাহাড়পুর", "ময়নামতি", "ঢাকা", "রাজশাহী"], ans: "রাজশাহী" },
        { id: 29, q: "২৯. ইস্পাহান নগরী কোন দেশে অবস্থিত?", opts: ["ইরাক", "ইরান", "সিরিয়া", "কুয়েত"], ans: "ইরান" },
        { id: 30, q: "৩০. বাংলাদেশ জাতিসংঘের কততম সদস্য?", opts: ["১৩১তম", "১৩৪তম", "১৩৩তম", "১৩৬তম"], ans: "১৩৬তম" },
        { id: 31, q: "৩১. 'বৈসাবি' কোন অঞ্চলের ক্ষুদ্র নৃগোষ্ঠীর উৎসব?", opts: ["পার্বত্য চট্টগ্রাম", "ময়মনসিংহ", "সিলেট", "রংপুর"], ans: "পার্বত্য চট্টগ্রাম" },
        { id: 32, q: "৩২. 'উইকিপিডিয়া' কী?", opts: ["উন্মুক্ত সফটওয়্যার", "মুক্ত শব্দকোষ", "মুক্ত বিশ্বকোষ", "ডেটাবেস"], ans: "মুক্ত বিশ্বকোষ" },
        { id: 33, q: "৩৩. 'জোয়ার ভাটা'র প্রধান কারণ কী?", opts: ["পৃথিবীর আকর্ষণ", "চাঁদের আকর্ষণ", "বায়ু প্রবাহ", "সূর্য়ের আকর্ষণ"], ans: "চাঁদের আকর্ষণ" },
        { id: 34, q: "৩৪. 'আল-আকসা' কোথায় অবস্থিত?", opts: ["জেরুজালেম", "জর্ডান", "গাজা উপত্যকা", "প্যালেস্টইন"], ans: "জেরুজালেম" },
        { id: 35, q: "৩৫. বাংলাদেশে মহান মুক্তিযুদ্ধে কয়টি সেক্টর ছিল?", opts: ["৮টি", "১০টি", "৬টি", "১১টি"], ans: "১১টি" },
        { id: 36, q: "৩৬. জীবন রক্ষকারী ঔষধ পেনিসিলিনের আবিষ্কারক কে?", opts: ["রবার্ট হুক", "আলেকজান্ডার ফ্লেমিং", "নিউটন", "প্লেটো"], ans: "আলেকজান্ডার ফ্লেমিং" },
        { id: 37, q: "৩৭. বিশ্বের প্রথম কার্বন প্রভাবমুক্ত দেশ কোনটি?", opts: ["জাপান", "ফিনল্যান্ড", "বাংলাদেশ", "ভুটান"], ans: "ভুটান" },
        { id: 38, q: "৩৮. জুলাই গণঅভ্যুত্থান শহিদ আবু সাঈদকে নিয়ে অঙ্কিত 'উন্নত মম শির' চিত্র কর্মটির অঙ্কন করেন—", opts: ["মৃণাল কান্তি সেন", "মঈনুল হোসেন", "মোস্তফা জব্বার", "শহীদ কবির"], ans: "শহীদ কবির" },
        { id: 39, q: "৩৯. কোন নেতা ফরায়েজী আন্দোলনে নেতৃত্ব দেন?", opts: ["হাজী শরীয়তউল্লাহ", "সুফি আব্দুর রউফ", "দুদু মিয়া", "তিতুমীর"], ans: "হাজী শরীয়তউল্লাহ" },

        { id: 94, q: "৯৪. বিশ্বের দীর্ঘতম নদীর নাম কী?", opts: ["আমাজন", "নীলনদ", "হোয়াংহো", "গঙ্গা"], ans: "নীলনদ" },
        { id: 95, q: "৯৫. 'ফ্যামিলি কার্ড' কর্মসূচি বাস্তবায়নের দায়িত্বে কোন মন্ত্রণালয়?", opts: ["সমাজকল্যাণ মন্ত্রণালয়", "বাণিজ্য মন্ত্রণালয়", "সংস্কৃতি মন্ত্রণালয়", "অর্থ মন্ত্রণালয়"], ans: "সমাজকল্যাণ মন্ত্রণালয়" },

        { id: 99, q: "৯৯. সম্প্রতি কোন দেশে বিদেশি মুদ্রার ব্যবহার নিষিদ্ধ করা হয়েছে?", opts: ["আফগানিস্তান", "উত্তরকোরিয়া", "রাশিয়া", "মায়ানমার"], ans: "আফগানিস্তান" },

    ];

    function renderQuestions() {
        const container = document.getElementById("questionsList");
        container.innerHTML = quizData.map(item => `
            <div class="question">
                <p>${item.q}</p>
                <div class="options">
                    ${item.opts.map(opt => `
                        <label><input type="radio" name="q${item.id}" value="${opt.trim()}"> ${opt}</label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }
    renderQuestions();

    function submitExam() {
        const name = document.getElementById("userName").value.trim() || "Anonymous";
        const roll = document.getElementById("userRoll").value.trim() || "N/A";

        let correct = 0, wrong = 0, unattempted = 0;
        let reviewHTML = "";

        quizData.forEach(item => {
            let selected = document.querySelector(`input[name="q${item.id}"]:checked`);
            if (selected) {
                let userAns = selected.value.trim();
                if (userAns === item.ans.trim()) {
                    correct++;
                    reviewHTML += `
                        <div class="review-card correct">
                            <p><strong>${item.q}</strong></p>
                            <p>✔ Your Answer: ${userAns} (Correct)</p>
                        </div>`;
                } else {
                    wrong++;
                    reviewHTML += `
                        <div class="review-card wrong">
                            <p><strong>${item.q}</strong></p>
                            <p>✖ Your Answer: ${userAns}</p>
                            <p>✔ Correct Answer: ${item.ans}</p>
                        </div>`;
                }
            } else {
                unattempted++;
                reviewHTML += `
                    <div class="review-card unattempted">
                        <p><strong>${item.q}</strong></p>
                        <p>⚠️ Unattempted</p>
                        <p>✔ Correct Answer: ${item.ans}</p>
                    </div>`;
            }
        });

        let totalScore = (correct * 1) - (wrong * 0.5);

        // Update score box on screen
        document.getElementById("out-score").innerText = `${totalScore} / ${quizData.length}`;
        document.getElementById("out-correct").innerText = correct;
        document.getElementById("out-wrong").innerText = wrong;
        document.getElementById("out-unattempted").innerText = unattempted;
        document.getElementById("answerReview").innerHTML = reviewHTML;
        
        // Show result section
        document.getElementById("result").style.display = "block";
        document.getElementById("result").scrollIntoView({ behavior: 'smooth' });

        // Web3Forms structured JSON payload matching Dashboard Columns
        const payload = {
            access_key: "8d78d562-9c87-49c9-b858-36fbfe88f919",
            subject: `Exam Set 1: ${name} (Roll: ${roll})`,
            "Student Name": name,
            "Roll Number": roll,
            "Correct Answers": correct,
            "Wrong Answers": wrong,
            "Unattempted": unattempted,
            "Final Score": `${totalScore} / ${quizData.length}`
        };

        if (navigator.onLine) {
            sendPayload(payload);
        } else {
            localStorage.setItem("pendingSet1", JSON.stringify(payload));
            document.getElementById("status-msg").innerText = "Result saved offline. Will auto-sync when online.";
            document.getElementById("status-msg").style.color = "orange";
        }
    }

    function sendPayload(data) {
        fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                document.getElementById("status-msg").innerText = "Result successfully transmitted to teacher!";
                document.getElementById("status-msg").style.color = "green";
                localStorage.removeItem("pendingSet1");
            }
        })
        .catch(() => {
            document.getElementById("status-msg").innerText = "Calculated on screen. Offline sync active.";
            document.getElementById("status-msg").style.color = "orange";
        });
    }

    window.addEventListener("online", function() {
        const pending = localStorage.getItem("pendingSet1");
        if (pending) sendPayload(JSON.parse(pending));
    });
</script>
