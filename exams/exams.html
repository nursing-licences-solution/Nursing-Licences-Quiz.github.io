<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Exam</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 24px; color: #333; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; color: #1a202c; font-size: 24px; }
    .desc { color: #64748b; margin-bottom: 24px; }
    .question-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 20px; background: #fafbfc; }
    .question-title { font-weight: 600; margin-bottom: 12px; }
    .option { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    .loading, .error { text-align: center; padding: 40px; font-size: 18px; color: #64748b; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="container" id="exam-container">
    <div class="loading">Loading exam, please wait...</div>
  </div>

  <script>
    async function loadExam() {
      const container = document.getElementById('exam-container');
      const params = new URLSearchParams(window.location.search);
      const examId = params.get('id');

      if (!examId) {
        container.innerHTML = `<div class="error">No exam ID specified in URL (e.g. ?id=exam1).</div>`;
        return;
      }

      try {
        // Fetch the corresponding JSON file
        const response = await fetch(`./exams/${examId}.json?t=${Date.now()}`);
        if (!response.ok) throw new Error("Exam not found");
        const data = await response.json();

        // Render exam header
        let html = `<h1>${data.title}</h1>`;
        if (data.description) html += `<p class="desc">${data.description}</p>`;
        html += `<form id="quizForm" onsubmit="handleSubmit(event)">`;

        // Render questions
        data.questions.forEach((q, index) => {
          html += `
            <div class="question-card">
              <div class="question-title">${index + 1}. ${q.prompt}</div>
          `;
          q.options.forEach((opt, optIndex) => {
            html += `
              <label class="option">
                <input type="radio" name="q_${q.id}" value="${opt}" required>
                <span>${opt}</span>
              </label>
            `;
          });
          html += `</div>`;
        });

        html += `<button type="submit">Submit Exam</button></form>`;
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div class="error">Could not load exam "<strong>${examId}</strong>". Please verify the link.</div>`;
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const answers = Object.fromEntries(formData.entries());
      console.log("Submitted answers:", answers);
      alert("Exam submitted successfully!");
      // Send answers to your server/webhook here
    }

    loadExam();
  </script>
</body>
</html>
